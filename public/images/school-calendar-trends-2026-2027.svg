<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">2026-2027 School Calendar Trends Across 100 Reviewed Districts</title>
  <desc id="desc">Data visualization showing start month, end month, winter break, and spring break distributions from the MySchoolDates 2026-2027 school calendar trends dataset.</desc>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <rect x="40" y="36" width="1120" height="688" rx="18" fill="#ffffff" stroke="#dbe3ef"/>
  <text x="80" y="92" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">2026-2027 School Calendar Trends</text>
  <text x="80" y="126" font-family="Arial, sans-serif" font-size="18" fill="#4b5563">Start dates, end dates, winter break, and spring break patterns from 100 reviewed district calendars</text>

  <g transform="translate(80 178)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">School Start Month Distribution</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="15" fill="#374151">August</text>
    <rect x="110" y="20" width="380" height="22" rx="11" fill="#dbeafe"/>
    <rect x="110" y="20" width="361" height="22" rx="11" fill="#2563eb"/>
    <text x="508" y="37" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">95 districts</text>
    <text x="0" y="75" font-family="Arial, sans-serif" font-size="15" fill="#374151">July</text>
    <rect x="110" y="60" width="380" height="22" rx="11" fill="#dbeafe"/>
    <rect x="110" y="60" width="15" height="22" rx="11" fill="#2563eb"/>
    <text x="508" y="77" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">4 districts</text>
    <text x="0" y="115" font-family="Arial, sans-serif" font-size="15" fill="#374151">September</text>
    <rect x="110" y="100" width="380" height="22" rx="11" fill="#dbeafe"/>
    <rect x="110" y="100" width="4" height="22" rx="11" fill="#2563eb"/>
    <text x="508" y="117" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">1 district</text>
  </g>

  <g transform="translate(80 354)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">School End Month Distribution</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="15" fill="#374151">May</text>
    <rect x="110" y="20" width="380" height="22" rx="11" fill="#d1fae5"/>
    <rect x="110" y="20" width="232" height="22" rx="11" fill="#059669"/>
    <text x="508" y="37" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">61 districts</text>
    <text x="0" y="75" font-family="Arial, sans-serif" font-size="15" fill="#374151">June</text>
    <rect x="110" y="60" width="380" height="22" rx="11" fill="#d1fae5"/>
    <rect x="110" y="60" width="148" height="22" rx="11" fill="#059669"/>
    <text x="508" y="77" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">39 districts</text>
  </g>

  <g transform="translate(650 178)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">Winter Break Start Dates</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="15" fill="#374151">Dec 21, 2026</text>
    <rect x="160" y="20" width="320" height="22" rx="11" fill="#e0f2fe"/>
    <rect x="160" y="20" width="285" height="22" rx="11" fill="#0284c7"/>
    <text x="498" y="37" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">89 records</text>
    <text x="0" y="75" font-family="Arial, sans-serif" font-size="15" fill="#374151">Dec 23-24</text>
    <rect x="160" y="60" width="320" height="22" rx="11" fill="#e0f2fe"/>
    <rect x="160" y="60" width="26" height="22" rx="11" fill="#0284c7"/>
    <text x="498" y="77" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">8 records</text>
    <text x="0" y="115" font-family="Arial, sans-serif" font-size="15" fill="#374151">Other/not listed</text>
    <rect x="160" y="100" width="320" height="22" rx="11" fill="#e0f2fe"/>
    <rect x="160" y="100" width="10" height="22" rx="11" fill="#0284c7"/>
    <text x="498" y="117" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">3 records</text>
  </g>

  <g transform="translate(650 354)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">Spring Break Clusters</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="15" fill="#374151">Mar 22, 2027</text>
    <rect x="160" y="20" width="320" height="22" rx="11" fill="#e0e7ff"/>
    <rect x="160" y="20" width="93" height="22" rx="11" fill="#4f46e5"/>
    <text x="498" y="37" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">29 districts</text>
    <text x="0" y="75" font-family="Arial, sans-serif" font-size="15" fill="#374151">Mar 15, 2027</text>
    <rect x="160" y="60" width="320" height="22" rx="11" fill="#e0e7ff"/>
    <rect x="160" y="60" width="80" height="22" rx="11" fill="#4f46e5"/>
    <text x="498" y="77" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">25 districts</text>
    <text x="0" y="115" font-family="Arial, sans-serif" font-size="15" fill="#374151">Mar 29, 2027</text>
    <rect x="160" y="100" width="320" height="22" rx="11" fill="#e0e7ff"/>
    <rect x="160" y="100" width="45" height="22" rx="11" fill="#4f46e5"/>
    <text x="498" y="117" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">14 districts</text>
    <text x="0" y="155" font-family="Arial, sans-serif" font-size="15" fill="#374151">Apr 5, 2027</text>
    <rect x="160" y="140" width="320" height="22" rx="11" fill="#e0e7ff"/>
    <rect x="160" y="140" width="32" height="22" rx="11" fill="#4f46e5"/>
    <text x="498" y="157" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">10 districts</text>
  </g>

  <line x1="80" y1="635" x2="1120" y2="635" stroke="#e5e7eb"/>
  <text x="80" y="676" font-family="Arial, sans-serif" font-size="16" fill="#374151">Source: MySchoolDates reviewed 2026-2027 district calendar dataset, July 27, 2026.</text>
  <text x="80" y="704" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">This is a reviewed platform dataset, not a census of every public school district in the United States.</text>
</svg>
