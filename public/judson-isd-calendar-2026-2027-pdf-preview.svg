<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Judson ISD Calendar 2026-2027 PDF preview</title>
  <desc id="desc">Visual summary of Judson ISD 2026-2027 school year dates, including first day, major breaks, early release dates, and last day.</desc>
